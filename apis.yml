name: Brooktrout Technology
description: >-
  Brooktrout Technology, Inc. was a Needham, Massachusetts telecommunications company founded in 1984 that
  designed fax and voice-processing hardware and software for computer telephony integration (CTI), including
  the TR114 and TR1034 fax boards and the SR140 host-based (software) fax product. Its developer kit, the
  Brooktrout SDK, provided C/C++ APIs for building fax, voice, and unified-messaging applications. Brooktrout
  was acquired by Excel Switching in 2000 (forming Brooktrout Technology / Excel), and the Brooktrout product
  line later became part of Dialogic, which continues to ship and document the Dialogic Brooktrout SDK. The
  brooktrout.com domain now redirects to Dialogic; Brooktrout survives as a legacy product brand rather than an
  independent company, and it has no standalone modern web-API developer surface. Surfaced as a portfolio
  company of Battery Ventures and added to the API Evangelist network as a stub lead.
